name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.5'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  # 静态检查 + 单元测试：这是硬门槛（analyze 必须零问题、测试必须全绿）。
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/setup_quickjs_dll.py
      - run: flutter analyze
      - run: flutter test

  # Python 工具链验收（D15）：tools/ 单测、夹具媒体自检与文档漂移扫描。
  # 只装 headless OpenCV；本机/远端验证结果分开记录，这里通过 ≠ 设备验收。
  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r tools/requirements-dev.txt
      - run: python -m unittest discover -s tools -p "test_*.py" -v
      - run: python tools/check_fixture_media.py
      - run: python tools/ui_doc_drift_scan.py --json
      - run: python tools/delivery_consistency_scan.py --json
      - run: python tools/check_text_encoding.py

  # CI acceptance APK uses explicit debug signing; production releases fail
  # closed unless the existing publisher's private signing material is provided.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build acceptance APK without production signing
        env:
          ORG_GRADLE_PROJECT_triomiAcceptanceSigning: 'true'
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: triomi-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # Windows ZIP + per-user MSI from the same release tree.
  windows:
    # webview_windows requires VS2022; windows-latest now selects VS2026.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build and package Windows ZIP + MSI
        shell: pwsh
        run: ./tools/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: triomi-windows
          path: |
            build/release/triomi-windows.zip
            build/release/triomi-windows.msi
            build/release/triomi-windows.update.json
            build/release/SHA256SUMS.txt
          if-no-files-found: error
