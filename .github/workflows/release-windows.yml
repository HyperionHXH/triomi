name: release-windows

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact Windows servicing source commit (does not move the release tag)'
        required: true
        type: string
      tag:
        description: 'Existing release whose Windows files alone are replaced'
        required: true
        default: 'v0.15.3'
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.5'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare canonical test temp directory
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP 'triomi-test-temp'
          New-Item -ItemType Directory -Force $testTemp | Out-Null
          "TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: flutter pub get
      - run: python tools/setup_quickjs_dll.py
      - name: Prepare checksum-pinned SQLite native asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'triomi-sqlite-native'
          New-Item -ItemType Directory -Force $stage | Out-Null
          gh release download sqlite3-3.6.0 --repo simolus3/sqlite3.dart --pattern sqlite3.x64.windows.dll --dir $stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $asset = Join-Path $stage 'sqlite3.x64.windows.dll'
          $expected = 'c5a4ebf9922c63fa252a01c4679992f1fbaa2762b962b78ba6cbdc5cbf7ca91c'
          if ((Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Upstream SQLite asset differs from sqlite3 3.6.0 pinned checksum'
          }
          # The package hook independently checks this exact digest before reuse.
          $cache = '.dart_tool/hooks_runner/shared/sqlite3/build/download-c5a4ebf9'
          New-Item -ItemType Directory -Force $cache | Out-Null
          Copy-Item $asset (Join-Path $cache 'sqlite3.dll')
      - name: Prepare checksum-pinned ECH dependency SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content packages/ech_http/lib/src/build_support/dependencies.json -Raw | ConvertFrom-Json
          $pin = $manifest.targets.'windows-x64'
          $url = [Uri]$pin.url
          if ($url.Host -ne 'github.com') { throw 'Unexpected SDK asset host' }
          $parts = $url.AbsolutePath.Trim('/').Split('/')
          $repository = $parts[0] + '/' + $parts[1]
          $assetName = $parts[-1]
          $stage = Join-Path $env:RUNNER_TEMP 'triomi-ech-native'
          New-Item -ItemType Directory -Force $stage | Out-Null
          gh release download $pin.release --repo $repository --pattern $assetName --dir $stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $asset = Join-Path $stage $assetName
          if ((Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) {
            throw 'Upstream ECH SDK differs from the existing dependency pin'
          }
          $cache = '.dart_tool/hooks_runner/shared/ech_http/build/prebuilt'
          New-Item -ItemType Directory -Force $cache | Out-Null
          Copy-Item $asset (Join-Path $cache ('windows-x64-' + $pin.sha256 + '.zip'))
      - run: flutter analyze
      - run: flutter test
      - name: Check Python tools and documentation
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r tools/requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_text_encoding.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ui_doc_drift_scan.py --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and package Windows only
        shell: pwsh
        run: ./tools/package_windows.ps1
      - name: Exercise real native updater rollback and ownership
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "TRIOMI_VS=%%I"
          if not defined TRIOMI_VS exit /b 1
          call "%TRIOMI_VS%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          rc /nologo /fo build\test_windows_update_install.res tools\test_windows_update_install.rc
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++17 /EHsc /W4 /utf-8 /DNOMINMAX tools\test_windows_update_install.cpp build\test_windows_update_install.res /Fe:build\test_windows_update_install.exe /Fo:build\test_windows_update_install.obj /link bcrypt.lib advapi32.lib shell32.lib ole32.lib uuid.lib version.lib user32.lib
          if errorlevel 1 exit /b %errorlevel%
          build\test_windows_update_install.exe "%CD%\build\windows\x64\runner\Release\triomi_update_helper.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: triomi-windows-servicing
          path: |
            build/release/triomi-windows.zip
            build/release/triomi-windows.msi
            build/release/triomi-windows.update.json
          if-no-files-found: error

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: triomi-windows-servicing
          path: artifacts
      - name: Replace Windows assets and preserve Android identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > before.json
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          before = json.loads(pathlib.Path('before.json').read_text())
          tag = os.environ['RELEASE_TAG']
          assert not before['draft'] and not before['prerelease'] and before['tag_name'] == tag
          android = next(asset for asset in before['assets'] if asset['name'] == 'triomi-android.apk')
          assert re.fullmatch(r'sha256:[a-f0-9]{64}', android['digest'])
          root = pathlib.Path('artifacts')
          manifest = json.loads((root / 'triomi-windows.update.json').read_text())
          assert tag == 'v' + manifest['version'] and manifest['windowsRevision'] > 0
          assert hashlib.file_digest((root / 'triomi-windows.zip').open('rb'), 'sha256').hexdigest() == manifest['sha256']
          manifest['sourceCommit'] = os.environ['SOURCE_REF']
          (root / 'triomi-windows.update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          lines = [android['digest'][7:] + '  triomi-android.apk\n']
          for name in ['triomi-windows.zip', 'triomi-windows.msi', 'triomi-windows.update.json']:
              lines.append(hashlib.file_digest((root / name).open('rb'), 'sha256').hexdigest() + '  ' + name + '\n')
          (root / 'SHA256SUMS.txt').write_text(''.join(lines))
          PY
          gh release upload "$RELEASE_TAG" artifacts/triomi-windows.zip artifacts/triomi-windows.msi artifacts/triomi-windows.update.json artifacts/SHA256SUMS.txt --clobber
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > after.json
          python - <<'PY'
          import json, pathlib
          before, after = [json.loads(pathlib.Path(name + '.json').read_text()) for name in ['before', 'after']]
          def android(doc):
              a = next(a for a in doc['assets'] if a['name'] == 'triomi-android.apk')
              return {key: a[key] for key in ['id', 'name', 'size', 'digest']}
          assert android(before) == android(after), 'Android release asset must not change'
          assert before['id'] == after['id'] and before['tag_name'] == after['tag_name']
          PY
