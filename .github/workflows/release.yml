name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (leave empty to build artifacts only)'
        required: false
        type: string

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare existing production signing identity
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TRIOMI_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TRIOMI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRIOMI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRIOMI_RELEASE_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Existing production signing secrets are required; no fallback identity.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/triomi-release.p12"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/triomi-release.p12" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$RUNNER_TEMP/triomi-signing.properties"
          printf 'TRIOMI_SIGNING_PROPERTIES=%s\n' "$RUNNER_TEMP/triomi-signing.properties" >> "$GITHUB_ENV"
      - run: flutter build apk --release
      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/triomi-release.p12" "$RUNNER_TEMP/triomi-signing.properties"
      - uses: actions/upload-artifact@v4
        with:
          name: triomi-android-release
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build and package Windows ZIP + MSI
        shell: pwsh
        run: ./tools/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: triomi-windows-release
          path: |
            build/release/triomi-windows.zip
            build/release/triomi-windows.msi
            build/release/triomi-windows.update.json
            build/release/SHA256SUMS.txt

  publish:
    if: inputs.tag != ''
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Name Android asset and checksum all release downloads
        shell: bash
        run: |
          set -eu
          mv artifacts/app-release.apk artifacts/triomi-android.apk
          cd artifacts
          sha256sum triomi-android.apk triomi-windows.zip triomi-windows.msi triomi-windows.update.json > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ contains(inputs.tag, '-') }}
          generate_release_notes: true
          files: |
            artifacts/triomi-android.apk
            artifacts/triomi-windows.zip
            artifacts/triomi-windows.update.json
            artifacts/triomi-windows.msi
            artifacts/SHA256SUMS.txt
