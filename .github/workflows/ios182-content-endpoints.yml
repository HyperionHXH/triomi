name: Diagnose failed iOS182 content endpoints
on:
  push:
    branches: [diagnostic/ios182-content-endpoints]
permissions:
  contents: read
jobs:
  connectivity:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: One anonymous request per failed content candidate
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,json,urllib.request,urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          copy={'Accept':'application/json','Accept-Language':'en-US,en;q=0.9,zh-TW;q=0.8,zh;q=0.7','Origin':'https://2025copy.com','Version':'2026.08.21','Region':'0','Webp':'0','platform':'1','User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/114.0','sec-fetch-dest':'document','sec-fetch-mode':'navigate','sec-fetch-site':'same-origin','sec-fetch-user':'?1','upgrade-insecure-requests':'1'}
          jobs=[('copy_chapter','https://api.copy4000.com/api/v3/comic/yiquanchaoren/chapter2/2d9edea8-4f03-11e9-8b1c-024352452ce0',copy),('copy_comments','https://api.copy4000.com/api/v3/roasts?limit=100&chapter_id=2d9edea8-4f03-11e9-8b1c-024352452ce0',copy),('dongman_content','https://www.dongmanmanhua.cn/SUSPENSE/ruchuyizhedenver/%E7%AC%AC1%E8%AF%9D/viewer?title_no=1954&episode_no=1',{'User-Agent':'Mozilla/5.0','Referer':'https://www.dongmanmanhua.cn/'})]
          def probe(job):
              name,url,headers=job
              result={'name':name,'requests':1,'retries':0,'credentials':False,'tls':'default verified','imagesFetched':False}
              try:
                  opener=urllib.request.build_opener(NoRedirect())
                  with opener.open(urllib.request.Request(url,headers=headers),timeout=20) as response:
                      data=response.read(4*1024*1024)
                      result.update(http=response.status,bytes=len(data))
                      if name.startswith('copy'):
                          value=json.loads(data);result['apiCode']=value.get('code')
                          body=value.get('results',{});result['chapterPresent']=isinstance(body.get('chapter'),dict) if name=='copy_chapter' else None
              except urllib.error.HTTPError as error: result.update(http=error.code,errorType='HTTPError')
              except (OSError,ValueError) as error: result.update(http=None,errorType=type(error).__name__)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              for result in pool.map(probe,jobs): print(json.dumps(result),flush=True)
          PY
