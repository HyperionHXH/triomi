org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Flutter 插件的 Kotlin 源码在 C:（Pub 缓存）而项目在 D:，增量编译无法跨盘符做相对路径，直接关掉。
kotlin.incremental=false
# flutter_js 0.8.7 的 Android 模块自带 Java 11 / Kotlin 1.8 两个不一致的 target，
# AGP 9 + Kotlin 2.4 会把这个校验当错误直接中断构建（:flutter_js:compileDebugKotlin）。
# 两者都是合法的 Android 字节码目标（D8 都能处理），这里把校验降为警告解除阻塞；
# 根治办法是上游插件对齐 target，或换成自带正确 Gradle 配置的 JS 引擎。
kotlin.jvm.target.validation.mode=warning
