name: triomi
description: "追番 · 漫画 · 小说 三位一体的聚合客户端。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态与路由
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # 本地数据
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  path_provider: ^2.1.6

  cupertino_icons: ^1.0.8

  # JS 规则沙箱（Android 用 quickjs / iOS 用 JavaScriptCore，均为 dart-ffi）
  flutter_js: ^0.8.7
  flutter_tts: ^4.2.5

  # 凭据安全存储（Android Keystore / Windows DPAPI）；T6 唯一新增插件
  flutter_secure_storage: ^9.2.4
  xpath_selector: ^3.0.2
  dio: ^5.11.1
  html: ^0.15.7
  crypto: ^3.0.7
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  # Windows 桌面解码库（D28）：缺它 media_kit 桌面路径无法出画。
  # libs 包不可混用——桌面构建会按平台各自取用，互不影响 Android。
  media_kit_libs_windows_video: ^1.0.11

  # 导出（纯 Dart zip 实现，无平台插件）
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  sqlite3: ^3.6.0
  # tools/static_check.dart（宿主管道故障时的同进程静态检查）用
  analyzer: any

flutter:
  uses-material-design: true
  assets:
    - assets/rules/
    - assets/opencc/
    - assets/fonts/catalog.json
