name: triomi
description: "追番 · 漫画 · 小说 三位一体的聚合客户端。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态与路由
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # 本地数据
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  path_provider: ^2.1.6

  cupertino_icons: ^1.0.8
  xpath_selector: ^3.0.2
  dio: ^5.11.1
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  sqlite3: ^3.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/rules/
